services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
      - ./backend/axxion_api:/var/www/laravel
    depends_on:
      - php
      - vue
    networks:
      - app-network

  php:
    build:
      context: ./backend/axxion_api
      dockerfile: Dockerfile
    volumes:
      - ./backend/axxion_api:/var/www/laravel
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    image: axxion-php

  vue:
    build:
      context: ./frontend_web/axxion_system
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend_web/axxion_system:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_USE_POLLING=1
      - CHOKIDAR_USEPOLLING=1
      - VITE_API_PROXY_TARGET=http://nginx:80
    networks:
      - app-network
    image: axxion-vue 

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - "./backend/sql/sistemarenta .sql:/docker-entrypoint-initdb.d/01-schema.sql"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge