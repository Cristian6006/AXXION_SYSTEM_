# Por defecto: Chrome VISIBLE (desarrollo local / IDE).
# Para CI sin pantalla: HEADLESS=true ./gradlew test

webdriver {
  base.url = "https://axxion-frontend.onrender.com"
  driver = chrome
  capabilities {
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--remote-allow-origins=*",
        "--disable-dev-shm-usage"
      ]
    }
  }
  wait.for.timeout = 15000
  timeouts.implicitlywait = 5000
}

serenity {
  project.name = "AXXION SYSTEM - Automatizacion E2E"
  take.screenshots = FOR_FAILURES
}

environments {
  headless {
    webdriver {
      capabilities {
        "goog:chromeOptions" {
          args = [
            "--start-maximized",
            "--remote-allow-origins=*",
            "--disable-dev-shm-usage",
            "--no-sandbox",
            "--headless=new"
          ]
        }
      }
    }
  }
}
