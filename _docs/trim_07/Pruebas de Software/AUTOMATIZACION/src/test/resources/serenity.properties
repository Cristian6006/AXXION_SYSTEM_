
# Navegador y Driver
webdriver.driver=chrome
webdriver.chrome.driver=src/test/resources/driver/chromedriver
chrome.switches=--start-maximized,--disable-notifications,--disable-popup-blocking,--disable-infobars
chrome_preferences.behavior=allow

# Proyecto
serenity.project.name=Automatizacion
serenity.use.unique.browser=true
serenity.browser.width=1920
serenity.browser.height=1080

# Timeouts
webdriver.timeouts.implicitlywait=10000
webdriver.wait.for.timeout=10000

# Screenshots y Reportes
serenity.take.screenshots=FOR_FAILURES
serenity.report.encode.screenshots=true
serenity.report.show.pie.charts=true
serenity.report.show.manual.tests=true

# Logging
serenity.verbose.steps=true
serenity.logging=NORMAL
serenity.report.encoding=UTF8
feature.file.encoding=UTF8

# Driver Capabilities
serenity.driver.capabilities=name:AXXION;unhandledPromptBehavior:ignore;handlesAlerts:true

# Parallel Execution
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# URL Base (puede ser sobrescrita por property)
axxion.baseUrl=http://localhost:5173/login
